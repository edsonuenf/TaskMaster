<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster - Dashboard</title>
    <link href="./output.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366F1',
                        secondary: '#818CF8',
                        cta: '#22C55E',
                        background: '#030712',
                        surface: '#111827',
                        text: '#F8FAFC',
                    },
                    fontFamily: {
                        sans: ['"Exo 2"', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'],
                    },
                    boxShadow: {
                        'neon': '0 0 10px rgba(99, 102, 241, 0.5), 0 0 20px rgba(99, 102, 241, 0.3)',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Exo 2', sans-serif; background-color: #030712; color: #F8FAFC; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Orbitron', sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .scrollbar-dark::-webkit-scrollbar { width: 6px; }
        .scrollbar-dark::-webkit-scrollbar-track { background: #111827; }
        .scrollbar-dark::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>
</head>

<body class="bg-background text-text min-h-screen">

    <div class="flex h-screen overflow-hidden">

        <!-- Sidebar -->
        <aside class="w-64 bg-surface border-r border-white/5 flex flex-col">
            <div class="p-6 border-b border-white/5">
                <a href="index.html" class="text-xl font-bold font-display text-primary tracking-widest">TASK<span class="text-white">MASTER</span></a>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <button onclick="showSection('projetos')" id="btn-projetos" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left hover:bg-white/5 transition-colors bg-primary/20 text-primary">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                    Projetos
                </button>
            </nav>
            <div class="p-4 border-t border-white/5">
                <div class="flex items-center gap-3 px-4 py-2">
                    <div class="w-8 h-8 rounded-full bg-primary/30 flex items-center justify-center text-primary font-bold text-sm">U</div>
                    <span class="text-sm text-gray-400">Usuário</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto scrollbar-dark">

            <!-- Header -->
            <header class="sticky top-0 z-40 bg-background/80 backdrop-blur-md border-b border-white/5 px-8 py-4 flex items-center justify-between">
                <h1 id="page-title" class="text-xl font-bold font-display">Projetos</h1>
                <button onclick="openModal()" class="bg-cta text-white px-4 py-2 rounded-lg font-bold hover:bg-green-500 transition-all flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span id="btn-novo-texto">Novo Projeto</span>
                </button>
            </header>

            <!-- Projetos Section -->
            <section id="section-projetos" class="p-8 space-y-8">
                <div id="lista-projetos">
                    <!-- Cards de projetos com tarefas serão inseridos aqui -->
                </div>
                <div id="empty-projetos" class="hidden text-center py-20">
                    <svg class="w-16 h-16 mx-auto text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                    <p class="text-gray-500 text-lg">Nenhum projeto criado ainda.</p>
                    <p class="text-gray-600 text-sm mt-2">Clique em "Novo Projeto" para começar.</p>
                </div>
            </section>

        </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="glass-card rounded-2xl p-8 w-full max-w-md mx-4 shadow-2xl">
            <div class="flex items-center justify-between mb-6">
                <h2 id="modal-titulo" class="text-xl font-bold font-display">Novo Projeto</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="form-modal" onsubmit="handleFormSubmit(event)">
                <div id="form-projeto" class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Nome do Projeto</label>
                        <input type="text" id="projeto-nome" class="w-full bg-surface border border-white/10 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none" placeholder="Ex: Site da Empresa">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Descrição</label>
                        <textarea id="projeto-descricao" rows="3" class="w-full bg-surface border border-white/10 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none resize-none" placeholder="Descreva o projeto..."></textarea>
                    </div>
                </div>
                <div id="form-tarefa" class="space-y-4 hidden max-h-[60vh] overflow-y-auto pr-2">
                    <input type="hidden" id="tarefa-projeto-id">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Título da Tarefa</label>
                        <input type="text" id="tarefa-titulo" class="w-full bg-surface border border-white/10 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none" placeholder="Ex: Post sobre lançamento">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Tipo de Post</label>
                        <select id="tarefa-tipo-post" onchange="toggleColunista()" class="w-full bg-surface border border-white/10 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none">
                            <option value="">Selecione o tipo</option>
                            <option value="simples">Simples</option>
                            <option value="colunista">Colunista</option>
                        </select>
                    </div>
                    <div id="campo-colunista" class="hidden">
                        <label class="block text-sm text-gray-400 mb-1">Nome do Colunista</label>
                        <input type="text" id="tarefa-nome-colunista" class="w-full bg-surface border border-white/10 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none" placeholder="Ex: João Silva">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Status</label>
                        <select id="tarefa-status" class="w-full bg-surface border border-white/10 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none">
                            <option value="pendente">Pendente</option>
                            <option value="em_andamento">Em Andamento</option>
                            <option value="em_revisao">Em Revisão</option>
                            <option value="aprovado">Aprovado</option>
                            <option value="publicado">Publicado</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Prioridade</label>
                        <select id="tarefa-prioridade" class="w-full bg-surface border border-white/10 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none">
                            <option value="baixa">Baixa</option>
                            <option value="media" selected>Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Data de Entrega</label>
                        <input type="date" id="tarefa-data-entrega" class="w-full bg-surface border border-white/10 rounded-lg px-4 py-3 text-white focus:border-primary focus:outline-none">
                    </div>
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-lg border border-white/20 text-white font-bold hover:bg-white/5 transition-colors">Cancelar</button>
                    <button type="submit" id="btn-salvar" class="flex-1 py-3 rounded-lg bg-cta text-white font-bold hover:bg-green-500 transition-colors">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-surface border border-white/10 rounded-lg px-6 py-4 shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <p id="toast-msg" class="text-white"></p>
    </div>

    <script src="./supabase-config.js"></script>
    <script src="./supabase-db.js"></script>

</body>

</html>
